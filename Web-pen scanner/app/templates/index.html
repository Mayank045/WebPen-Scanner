<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web-Pen Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Cybersecurity project</p>
          <h1>Web-Pen Scanner</h1>
        </div>
      </header>

      <main class="dashboard">
        <section class="panel form-panel">
          <h2>Start a scan</h2>
          <form id="scan-form">
            <label for="target-url">Target URL</label>
            <input id="target-url" type="url" placeholder="https://example.com" required />
            <button type="submit">Run scan</button>
          </form>
          <p id="scan-status" class="status-text">Ready to scan.</p>
        </section>

        <section class="panel list-panel">
          <h2>Previous scans</h2>
          <ul id="scan-list" class="scan-list"></ul>
        </section>

        <section class="panel result-panel">
          <h2>Latest results</h2>
          <div id="result-details" class="result-details empty-state">
            No scan selected yet.
          </div>
        </section>
      </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
